<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Ready to Grow — ระบบบันทึกและตรวจสอบเกษตรอินทรีย์ สำหรับเกษตรกร เจ้าหน้าที่ ICS และผู้ดูแลระบบ">
  <meta name="theme-color" content="#183F32">
  <title>Ready to Grow — รักษามาตรฐานสินค้าเกษตรอินทรีย์ ชุมชนผักไหม</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script defer src="/demo.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header id="main-header">
    <div class="wrap header-wrap">
      <div class="header-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 36 36" fill="none">
            <path d="M6 28C6 16 14 6 24 4C24 16 16 26 6 28Z" fill="#15803D"/>
            <path d="M8 26C12 21 16 15 20 8" stroke="#DCFCE7" stroke-width="2" stroke-linecap="round"/>
            <path d="M17 28C17 18 23 10 32 8C32 18 26 26 17 28Z" fill="#22C55E"/>
            <path d="M19 26C22 22 25 17 29 12" stroke="#DCFCE7" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title-row">
            <span class="brand-name">Ready to Grow</span>
            <span class="brand-badge">PakMaii</span>
          </div>
          <div class="brand-org">ระบบบริหารมาตรฐานเกษตรอินทรีย์ • วิสาหกิจชุมชนตำบลผักไหม</div>
        </div>
      </div>
      <div id="farmerSubNav" class="header-sub-nav hide">
        <button type="button" id="farmerBackBtn" class="header-back-btn" aria-label="กลับหน้าหลัก">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>หน้าหลัก</span>
        </button>
        <span id="farmerScreenTitle" class="header-sub-title"></span>
      </div>
      <div class="header-status">
        <button type="button" id="lineOaBtn" class="line-oa-header-btn" aria-label="เปิดแชท LINE OA ถามสถานะด่วน">💬 LINE OA</button>
        <button type="button" id="notifBellBtn" class="notif-bell-btn" aria-label="การแจ้งเตือน LINE">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notifBadge" class="notif-badge hide">0</span>
        </button>
        <button type="button" id="demoToolsBtn" class="demo-tools-btn hide" aria-haspopup="dialog" aria-label="เปิดเครื่องมือทดสอบระบบ Demo">Demo</button>
        <button type="button" id="pitchGuideBtn" class="font-scale-btn pitch-guide-btn" aria-label="เปิดบทสาธิตระบบ 3 นาทีสำหรับนำเสนอ">🎯 บทสาธิต 3 นาที</button>
        <button type="button" id="tutorialHelpBtn" class="font-scale-btn" aria-label="เปิดคู่มือแนะนำการใช้งานระบบ">คู่มือแนะนำ</button>
        <button type="button" id="fontScaleToggle" class="font-scale-btn" aria-pressed="false" aria-label="สลับขนาดตัวอักษรใหญ่สำหรับผู้สูงอายุ">ก+ ตัวอักษรใหญ่</button>
        <button type="button" id="offlineStatusBadge" class="offline-status-pill" aria-label="สถานะความพร้อมใช้งานออฟไลน์กลางทุ่งนา" title="ระบบพร้อมบันทึกข้อมูลในเครื่องแม้อยู่กลางทุ่งนาไม่มีสัญญาณอินเทอร์เน็ต">
          <span class="offline-status-dot"></span> พร้อมบันทึกออฟไลน์
        </button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="hero">
      <h2 id="welcome">ยินดีต้อนรับ</h2>
      <div id="identity" aria-live="polite">
        <div class="skeleton-loader" aria-hidden="true">
          <div class="skeleton-line skeleton-title"></div>
          <div class="skeleton-line skeleton-subtitle"></div>
        </div>
      </div>
    </div>
    <nav id="tabs" class="hide" aria-label="เมนูหลัก"></nav>
    <section id="content" aria-live="polite"></section>
  </main>
  <nav id="mobile-dock" class="mobile-dock hide" aria-label="เมนูลัดบนมือถือ"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
