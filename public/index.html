<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Ready to Grow — ระบบบันทึกและตรวจสอบเกษตรอินทรีย์ สำหรับเกษตรกร เจ้าหน้าที่ ICS และผู้ดูแลระบบ">
  <meta name="theme-color" content="#064e3b">
  <title>Ready to Grow — เข้าสู่ระบบทดลองใช้งาน</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script defer src="/demo.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="sim-bar" class="wrap sim-bar-wrap">
    <div class="sim-toggle-bar">
      <div class="sim-brand-box">
        <span class="sim-icon">🌾</span>
        <b>PakMaii — Ready to Grow (ตำบลผักไหม จ.ศรีสะเกษ)</b>
      </div>
      <div class="sim-actions-box">
        <button type="button" id="togglePhoneBtn" class="sim-toggle-btn" title="สลับมุมมองระหว่าง LINE OA มือถือเกษตรกร กับ Dashboard เดสก์ท็อป">
          📱 โหมดจำลองมือถือ (LINE OA / LIFF View)
        </button>
        <button type="button" id="simWebhookBtn" class="sim-toggle-btn sim-webhook-btn" title="จำลองการส่งข้อมูลกิจกรรมผ่าน LINE Webhook สำหรับการสาธิต">
          ⚡ จำลอง LINE Webhook
        </button>
      </div>
    </div>
  </div>
  <header id="main-header">
    <div class="wrap">
      <div class="header-brand">
        <div>
          <small class="eyebrow">Smart &amp; Sustainable Organic Farming — Spark Hack Season #2</small>
          <h1 class="brand-title">Ready to Grow <span class="brand-badge">PakMaii Demo</span></h1>
          <small>ระบบบันทึก ตรวจรับรอง PGS/ICS และบริหารความเสี่ยงแปลงอินทรีย์ ตำบลผักไหม</small>
        </div>
      </div>
    </div>
  </header>
  <div id="phone-container">
    <main class="wrap" id="main-wrap">
      <div class="hero">
        <h2 id="welcome">ยินดีต้อนรับ</h2>
        <div id="identity" aria-live="polite">กำลังโหลด...</div>
      </div>
      <nav id="tabs" class="hide" aria-label="เมนูหลัก"></nav>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
